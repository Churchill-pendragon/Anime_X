<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <style>
            body{
                background-image: url(Welcome.jpg);
                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: fixed;
            }
            .date{
                color: gray;
                font-size:x-large;
            }
            .sign{
            background-color: #39ff14;
            color:yellowgreen ;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            font-weight: bold;
        }
        .sign:hover{
            background-color: #FF6700;
            transform: scale(1.05);
        }
        .log{
            background-color: #BC13FE;
            color:yellow ;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.4s;
            font-weight: bold;
            border: none;
        }
        .log:hover{
            background-color: transparent;
            transform: scale(1.05);
            font-weight: lighter;
        }
        .navbar{
            background: linear-gradient(#004085,#007bff);
            overflow: hidden;
            padding: 30px 100px;
        }
        ul{
            list-style: none;
        }
        #H{
            position: absolute;
            top: 20px;
            left: 150px;
            font-size: xx-large;
        }
        #C{
            position: absolute;
            top: 20px;
            left: 450px;
            font-size: xx-large;
        }
        #A{
            position: absolute;
            top: 20px;
            right: 570px;
            font-size: xx-large;
        }
        #P{
            position: absolute;
            top: 20px;
            right: 250px;
            font-size: xx-large;
        }
        .vid{
                position: absolute;
                right: 100px;
                top: 200px;
                height: 500;
                width: 700px;
            }
        .error{
            color: #ff4444;
            font-size: 14px;
            margin-top: 5px;
            display: none;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
        }
        .input-group{
            margin-bottom: 20px;
        }
        input.invalid{
            border: 2px solid #ff4444;
        }
        input{
            height: 30px;
            width: 160px;
            border-radius: 9px;
            border: 2px solid #ccc;
            padding: 5px;
        }
        .password-strength{
            font-size: 12px;
            margin-top: 5px;
            display: none;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
        }
        .strength-weak{ color: #ff4444; }
        .strength-medium{ color: #ff9800; }
        .strength-strong{ color: #4caf50; }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li id="H"><a href="Homepage.html" style="text-decoration: none; color: black;">Home</a></li>
            <li id="C"><a href="Chat.html" style="text-decoration: none;color: black;">Chatroom</a></li>
            <li id="A"><a href="About.htm" style="text-decoration: none;color: black;">About</a></li>
            <li id="P"><a href="Profile.html" style="text-decoration: none;color: black;">Profile</a></li>
        </ul>
    </nav><br><br><br>
    
    <h1 style="color: #ff9800;">Signup</h1>
    
    
    <div class="input-group">
        <input type="text" id="username" placeholder="Username"><br>
        <span class="error" id="usernameError">Username must be 3-20 characters</span>
    </div>
    
    <div class="input-group">
        <input type="password" id="password" placeholder="Password"><br>
        <span class="password-strength" id="passwordStrength"></span>
        <span class="error" id="passwordError">Password must be at least 6 characters</span>
    </div>
    
    <video controls class="vid">
            <source src="Amv.mp4" type="video/mp4" autoplay>
        </video>

    <button class="sign" onclick="validateSignIn()">SIGN IN</button><br><br>

    <script>
        function validateSignIn() {
            let isValid = true;
            
            // Get input values
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            
            // Reset errors
            username.classList.remove('invalid');
            password.classList.remove('invalid');
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';
            
            // Validate username
            if (!username.value || username.value.length < 3 || username.value.length > 20) {
                username.classList.add('invalid');
                usernameError.style.display = 'block';
                isValid = false;
            }
            
            // Check for special characters in username
            const usernamePattern = /^[a-zA-Z0-9_]+$/;
            if (username.value && !usernamePattern.test(username.value)) {
                username.classList.add('invalid');
                usernameError.textContent = 'Username can only contain letters, numbers, and underscores';
                usernameError.style.display = 'block';
                isValid = false;
            }
            
            // Validate password
            if (!password.value || password.value.length < 6) {
                password.classList.add('invalid');
                passwordError.style.display = 'block';
                isValid = false;
            }
            
            // If all validation passes, redirect
            if (isValid) {
                alert('Sign in successful! Welcome, ' + username.value + '!');
                window.location.href = 'Homepage.html';
            }
        }
        
        // Real-time username validation
        document.getElementById('username').addEventListener('input', function() {
            const usernameError = document.getElementById('usernameError');
            const usernamePattern = /^[a-zA-Z0-9_]+$/;
            
            if (this.value.length < 3 || this.value.length > 20) {
                this.classList.add('invalid');
                usernameError.textContent = 'Username must be 3-20 characters';
                usernameError.style.display = 'block';
            } else if (!usernamePattern.test(this.value)) {
                this.classList.add('invalid');
                usernameError.textContent = 'Username can only contain letters, numbers, and underscores';
                usernameError.style.display = 'block';
            } else {
                this.classList.remove('invalid');
                usernameError.style.display = 'none';
            }
        });
        
        // Real-time password validation with strength indicator
        document.getElementById('password').addEventListener('input', function() {
            const passwordError = document.getElementById('passwordError');
            const passwordStrength = document.getElementById('passwordStrength');
            
            if (this.value.length < 6) {
                this.classList.add('invalid');
                passwordError.style.display = 'block';
                passwordStrength.style.display = 'none';
            } else {
                this.classList.remove('invalid');
                passwordError.style.display = 'none';
                
                // Calculate password strength
                let strength = 0;
                if (this.value.length >= 8) strength++;
                if (/[a-z]/.test(this.value) && /[A-Z]/.test(this.value)) strength++;
                if (/\d/.test(this.value)) strength++;
                if (/[!@#$%^&*]/.test(this.value)) strength++;
                
                passwordStrength.style.display = 'block';
                if (strength <= 1) {
                    passwordStrength.textContent = 'Weak password';
                    passwordStrength.className = 'password-strength strength-weak';
                } else if (strength <= 2) {
                    passwordStrength.textContent = 'Medium password';
                    passwordStrength.className = 'password-strength strength-medium';
                } else {
                    passwordStrength.textContent = 'Strong password';
                    passwordStrength.className = 'password-strength strength-strong';
                }
            }
        });
    </script>
</body>
</html>
